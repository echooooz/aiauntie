    <title>AiAuntie</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AiAuntie" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2829/2829824.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* iOS-like scrollbar hiding and safe area spacing */
      body {
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #F2F2F7; /* iOS System Gray 6 */
        /* Prevent bounce scroll on body to feel more native */
        overscroll-behavior-y: none; 
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .safe-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      /* Voice Wave Animation */
      .voice-wave {
        display: inline-block;
        width: 6px;
        height: 20px;
        border-radius: 10px;
        animation: wave 1s ease-in-out infinite;
      }
      .voice-wave:nth-child(1) { animation-delay: 0.0s; height: 15px; }
      .voice-wave:nth-child(2) { animation-delay: 0.1s; height: 25px; }
      .voice-wave:nth-child(3) { animation-delay: 0.2s; height: 35px; }
      .voice-wave:nth-child(4) { animation-delay: 0.3s; height: 20px; }
      .voice-wave:nth-child(5) { animation-delay: 0.4s; height: 10px; }

      @keyframes wave {
        0%, 100% { transform: scaleY(1); opacity: 0.6; }
        50% { transform: scaleY(1.5); opacity: 1; background-color: #FF2D55; }
      }
    </style>
